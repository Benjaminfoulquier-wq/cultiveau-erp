[options]
; Cultiveau ERP — configuration d'Odoo 18 dans le conteneur (voir docker-compose.yml).
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Le mot de passe maître (création / sauvegarde des bases) est lu dans l'environnement
; ODOO_ADMIN_PASSWD par scripts/installer.sh ; ne pas l'écrire ici.
list_db = False
proxy_mode = True
; Deux processus de travail suffisent au réseau ; le cron tourne dans l'un d'eux.
workers = 2
max_cron_threads = 1
limit_time_cpu = 300
limit_time_real = 600
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
log_level = info
