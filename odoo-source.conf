[options]
; Configuration quand Odoo est construit depuis les sources (Dockerfile) : le code est dans /opt/odoo.
addons_path = /mnt/extra-addons,/opt/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_user = odoo
list_db = False
proxy_mode = True
workers = 2
max_cron_threads = 1
limit_time_cpu = 300
limit_time_real = 600
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
log_level = info
